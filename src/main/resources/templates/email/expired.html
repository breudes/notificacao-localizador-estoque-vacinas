<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 24px;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Inventários com lotes expirados ⏰</h2>

    <ul>
        <li th:each="inventoryId : ${inventoriesId}">
            <strong th:text="${inventoryId}"></strong>
        </li>
    </ul>

    <p>
        📅 Data e horário da consulta:
        <strong th:text="${eventDate}">10/01/2026 14:00</strong>
    </p>

    <div class="footer">
        <p>Esta é uma mensagem automatizada. Por favor, não responda.</p>
    </div>
</div>

</body>
</html>
